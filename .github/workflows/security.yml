name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Slither and solc
        run: |
          python -m pip install --upgrade pip
          python -m pip install slither-analyzer solc-select
          solc-select install 0.8.26
          solc-select use 0.8.26

      # The reviewed baseline is 0 Critical / 0 High. Medium and Low findings are
      # triaged in docs/security-review.md; the gate only blocks a new High/Critical.
      - name: Gate on new Critical or High findings
        run: |
          slither contracts \
            --compile-force-framework solc \
            --solc-solcs-select 0.8.26 \
            --solc-disable-warnings \
            --exclude-informational --exclude-low --exclude-medium \
            --fail-high
