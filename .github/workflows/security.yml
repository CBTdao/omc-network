name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Slither and solc
        run: |
          python -m pip install --upgrade pip
          python -m pip install slither-analyzer solc-select
          solc-select install 0.8.26
          solc-select use 0.8.26

      # The reviewed baseline is 0 Critical / 0 High. Medium and Low findings are
      # triaged in docs/security-review.md; the gate only blocks a new High/Critical.
      - name: Run Slither
        run: |
          # crytic-compile's solc platform needs a file target, not a directory.
          # A temporary entry point pulls in the three production contracts.
          cat > contracts/_slither_entry.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.24;
          import "./OMCTestToken.sol";
          import "./OMCStaking.sol";
          import "./OMCComputeMarket.sol";
          EOF
          slither contracts/_slither_entry.sol \
            --compile-force-framework solc \
            --solc-solcs-select 0.8.26 \
            --solc-disable-warnings \
            --json slither-ci.json > slither-out.txt 2>&1 || true
          rm -f contracts/_slither_entry.sol
          echo "=== slither output (tail) ==="
          tail -15 slither-out.txt
          if [ ! -s slither-ci.json ]; then
            DIAG=$(tail -20 slither-out.txt | tr '\n' ' ' | cut -c1-1800)
            echo "::error::Slither failed: $DIAG"
          else
            echo "report bytes: $(wc -c < slither-ci.json)"
          fi

      - name: Gate on Critical or High findings
        run: |
          python - <<'PY'
          import json, sys
          try:
              with open("slither-ci.json", encoding="utf-8") as fh:
                  data = json.load(fh)
          except Exception as exc:
              print(f"::error::Slither produced no parseable report: {exc}")
              sys.exit(1)
          hits = []
          for detector in data.get("detectors", []):
              impact = (detector.get("impact") or "").lower()
              if impact in ("high", "critical"):
                  hits.append(f"{impact}/{detector.get('check')}")
          print(f"High/Critical findings: {len(hits)}")
          if hits:
              print("::error::" + ", ".join(sorted(set(hits))))
              sys.exit(1)
          PY
