name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Slither and solc
        run: |
          python -m pip install --upgrade pip
          python -m pip install slither-analyzer solc-select
          solc-select install 0.8.26
          solc-select use 0.8.26

      # The reviewed baseline is 0 Critical / 0 High. Medium and Low findings are
      # triaged in docs/security-review.md; the gate only blocks a new High/Critical.
      - name: Run Slither
        run: |
          # crytic-compile's solc platform needs a file target, and the contracts
          # each declare their own IERC20Like interface — scan them separately.
          : > slither-out.txt
          for name in OMCTestToken OMCStaking OMCComputeMarket; do
            slither "contracts/$name.sol" \
              --compile-force-framework solc \
              --solc-solcs-select 0.8.26 \
              --solc-disable-warnings \
              --json "slither-$name.json" >> slither-out.txt 2>&1 || true
          done
          python - <<'PY'
          import glob, json, sys
          reports = sorted(glob.glob("slither-OMC*.json"))
          if len(reports) != 3:
              print(f"::error::Expected 3 Slither reports, got {len(reports)}")
              sys.exit(1)
          merged = {"detectors": []}
          for path in reports:
              with open(path, encoding="utf-8") as fh:
                  try:
                      merged["detectors"].extend(json.load(fh).get("detectors", []))
                  except Exception:
                      continue
          with open("slither-ci.json", "w", encoding="utf-8") as fh:
              json.dump(merged, fh)
          print("merged detectors:", len(merged["detectors"]))
          PY
          echo "=== slither output (tail) ==="
          tail -15 slither-out.txt
          if [ ! -s slither-ci.json ]; then
            DIAG=$(tail -20 slither-out.txt | tr '\n' ' ' | cut -c1-1800)
            echo "::error::Slither failed: $DIAG"
          else
            echo "report bytes: $(wc -c < slither-ci.json)"
          fi

      - name: Gate on Critical or High findings
        run: |
          python - <<'PY'
          import json, sys
          try:
              with open("slither-ci.json", encoding="utf-8") as fh:
                  data = json.load(fh)
          except Exception as exc:
              print(f"::error::Slither produced no parseable report: {exc}")
              sys.exit(1)
          hits = []
          for detector in data.get("detectors", []):
              impact = (detector.get("impact") or "").lower()
              if impact in ("high", "critical"):
                  hits.append(f"{impact}/{detector.get('check')}")
          print(f"High/Critical findings: {len(hits)}")
          if hits:
              print("::error::" + ", ".join(sorted(set(hits))))
              sys.exit(1)
          PY
