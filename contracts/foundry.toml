# Property-based test harness for the OMC testnet contracts.
#
# The contracts under test import nothing, and this harness keeps it that way:
# forge-std is deliberately NOT vendored. The cheatcode interface and the few
# assertion helpers the tests need live in test/Vm.sol.
#
# Run:  forge test -vv
[profile.default]
src = "."
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"

[fuzz]
runs = 512

[invariant]
runs = 32
depth = 24
