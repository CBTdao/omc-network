<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Real or AI — the daily photo challenge</title>
<meta name="description" content="Five pairs a day. In each pair one photograph is real and one was generated by AI. Pick the real one, keep your streak, and train your eye.">
<link rel="canonical" href="https://game.omc.network/">
<meta name="theme-color" content="#0b1220">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M32 8a24 24 0 0 0 0 48Z' fill='%234da3ff'/%3E%3Cpath d='M32 8a24 24 0 0 1 0 48Z' fill='none' stroke='%23ff7a7a' stroke-width='4' stroke-dasharray='7 6'/%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:title" content="Real or AI — the daily photo challenge">
<meta property="og:description" content="Five pairs a day. One photograph is real, one was generated by AI. Pick the real one.">
<meta property="og:url" content="https://game.omc.network/">
<meta property="og:image" content="https://game.omc.network/assets/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Real or AI — five pairs a day, one real photograph and one AI-generated image.">

<meta name="twitter:title" content="Real or AI — the daily photo challenge">
<meta name="twitter:description" content="Five pairs a day. One photograph is real, one was generated by AI. Pick the real one.">

<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebSite","name":"Real or AI","url":"https://game.omc.network/",
"description":"A daily photo challenge: five pairs a day, one real photograph and one AI-generated image in each. Pick the real one.",
"potentialAction":{"@type":"PlayAction","target":"https://game.omc.network/"}}
</script>
<style>
:root{
  --bg:#0b1220; --card:#15233c; --line:#25385c; --tx:#e8eefb; --tx2:#a9bcd8; --tx3:#7b91b5;
  --acc:#4da3ff; --ok:#38d6a8; --no:#ff7a7a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:0 0 40px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 0}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
.logo{font-size:19px;font-weight:800;letter-spacing:.5px}
.logo span{color:var(--acc)}
.streak{font-size:13px;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 11px;
  font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:8px;margin:4px 0 14px}
.tab{flex:1;text-align:center;background:transparent;border:1px solid var(--line);color:var(--tx2);
  border-radius:10px;padding:9px 0;font-size:14px;cursor:pointer;user-select:none}
.tab.on{background:var(--acc);border-color:var(--acc);color:#041021;font-weight:700}
.hint{font-size:14px;color:var(--tx2);text-align:center;margin:2px 0 12px;min-height:20px}
.hint b{color:var(--tx)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shot{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#0e1829;cursor:pointer;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .08s ease,border-color .12s ease}
.shot:active{transform:scale(.985)}
.shot:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.shot img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;pointer-events:none}
.shot .tag{position:absolute;left:8px;top:8px;font-size:12px;font-weight:700;background:rgba(4,16,31,.72);
  color:var(--tx);border-radius:6px;padding:2px 7px;pointer-events:none}
.shot.pick{border-color:var(--acc)}
.shot.right{border-color:var(--ok)}
.shot.wrong{border-color:var(--no)}
.shot .verdict{position:absolute;inset:auto 0 0 0;font-size:12.5px;font-weight:700;text-align:center;padding:5px 0;pointer-events:none}
.verdict.ok{background:rgba(56,214,168,.92);color:#041021}
.verdict.no{background:rgba(255,122,122,.92);color:#2a0505}
.progress{display:flex;gap:6px;justify-content:center;margin:14px 0 6px}
.dot{width:26px;height:5px;border-radius:3px;background:var(--line)}
.dot.on{background:var(--acc)}.dot.ok{background:var(--ok)}.dot.no{background:var(--no)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--acc);color:#041021;border:0;border-radius:9px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;
  text-decoration:none;display:inline-block;font-family:inherit}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.statline{font-size:13.5px;color:var(--tx2);text-align:center;margin-top:8px;line-height:1.6}
.big{font-size:30px;font-weight:800;text-align:center;margin:4px 0;font-variant-numeric:tabular-nums}
.sharebox{width:100%;background:#0e1829;border:1px solid var(--line);color:var(--tx);border-radius:10px;
  padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;resize:none}
.credits{font-size:11.5px;color:var(--tx3);margin-top:10px;text-align:center;line-height:1.6}
.credits a{color:var(--tx3)}
footer{text-align:center;color:var(--tx3);font-size:12px;padding:18px 12px 0;line-height:1.7}
footer a{color:var(--tx3)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(18px);background:var(--ok);
  color:#041021;padding:10px 18px;border-radius:24px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">REAL<span>·</span>OR<span>·</span>AI</div>
    <div class="streak" id="streak" title="Consecutive days played">🔥 0</div>
  </header>

  <div class="tabs">
    <div class="tab on" id="tabDaily" role="tab" aria-selected="true">Daily</div>
    <div class="tab" id="tabFree" role="tab" aria-selected="false">Practice</div>
  </div>

  <div id="dailyView">
    <div class="hint" id="hint">Which one is the real photograph?</div>
    <div class="pair" id="pair"></div>
    <div class="progress" id="prog"></div>
    <div class="statline" id="stat" aria-live="polite"></div>
    <div id="result"></div>
  </div>

  <div id="freeView" class="hidden">
    <div class="hint">Endless practice — no streak, no pressure.</div>
    <div class="pair" id="pair2"></div>
    <div class="statline" id="stat2" aria-live="polite"></div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="nextFree">Next pair</button></div>
  </div>

  <div class="credits" id="credits"></div>
</div>

<footer>
  <a href="guide.html">How to spot an AI photo</a> · <a href="daily/">Daily archive</a><br>
  Real photographs from Wikimedia Commons under CC / public-domain licences, credited in-game. AI images generated offline.<br>
  <span id="footnote"></span>
</footer>

<div id="toast">copied</div>
<div class="sr" id="live" aria-live="polite"></div>
<script src="data/daily.js"></script>
<script src="data/puzzles.js"></script>
<script>
(function(){
  var P = window.__PUZZLES__ || [];
  var D = window.__AOR_DAILY__;
  var $ = function(id){return document.getElementById(id)};
  var KEY='aor_v1';

  function load(){ try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}} }
  function save(s){ try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){} }
  var S = load();
  S.streak = S.streak||0; S.lastDay = S.lastDay||''; S.history = S.history||{};
  S.n = S.n||0; S.right = S.right||0; S.cats = S.cats||{};

  function today(){ return D.today(); }
  function dailySet(){ return D.dailySet(P, today()); }

  var set = dailySet(), idx = 0, picks = [], locked = false, freeRecent = [];

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // 难度描述（真实数据，不是编的全球正确率）；返回纯文本，转义由调用方负责
  var DIFF = {1:'Warm-up.', 2:'Solid difficulty.', 3:'The hard one.'};
  function diffLine(p){
    var base = (DIFF[p.d] || DIFF[2]) + ' ';
    var c = S.cats[p.cat];
    if(c && c.n) base += 'You are ' + c.right + '/' + c.n + ' on ' + p.cat + ' so far.';
    else base += 'First ' + p.cat + ' pair for you.';
    return base;
  }

  function renderStreak(){ $('streak').textContent = '🔥 ' + (S.streak||0); }

  // <picture>：WebP 优先，JPEG 兜底；alt 不透露答案
  // 注意：这里【不写】width/height 属性 —— 游戏内是正方形 object-fit:cover 显示，
  // 空间由 CSS aspect-ratio:1/1 预留（同样不会抖）。写了属性反而会把 aspect-ratio 顶掉，
  // 让 800x736 的图按原始比例拉成竖长条。每日答案页才需要属性（那里按原始比例显示）。
  function imgTag(o, alt, first){
    var h = '<picture>';
    if(o.webp && o.webp !== o.file) h += '<source srcset="'+esc(o.webp)+'" type="image/webp">';
    h += '<img src="'+esc(o.file)+'" alt="'+esc(alt)+'"'+
         (first?' fetchpriority="high"':'')+' decoding="async">';
    return h + '</picture>';
  }

  function drawPair(el, p, onPick, first){
    el.innerHTML = '';
    var opts = [
      {side:'real', src:p.real, label:'A'},
      {side:'ai',   src:p.ai,   label:'B'}
    ];
    if(D.flip(p.id, today())) opts.reverse();
    opts.forEach(function(o, i){
      var d = document.createElement('div');
      d.className = 'shot'; d.dataset.side = o.side;
      d.setAttribute('role','button'); d.setAttribute('tabindex','0');
      d.setAttribute('aria-label','Option ' + o.label + ' — pick this photo');
      d.innerHTML = imgTag(o.src, 'Option ' + o.label, first && i===0) + '<div class="tag">'+o.label+'</div>';
      function go(){ if(locked) return; onPick(o.side, d); }
      d.onclick = go;
      d.onkeydown = function(e){
        if(e.key==='Enter' || e.key===' ' || e.key==='Spacebar'){ e.preventDefault(); go(); }
      };
      el.appendChild(d);
    });
  }

  function mark(el, chosen, p){
    locked = true;
    var kids = el.children;
    for(var i=0;i<kids.length;i++){
      var k = kids[i], side = k.dataset.side;
      var v = document.createElement('div');
      if(side === 'real'){ k.classList.add('right'); v.className='verdict ok'; v.textContent='REAL PHOTO'; }
      else { k.classList.add('wrong'); v.className='verdict no'; v.textContent='AI GENERATED'; }
      k.appendChild(v);
      if(side === chosen) k.classList.add('pick');
      k.removeAttribute('tabindex'); k.removeAttribute('role');
    }
    $('live').textContent = (chosen==='real' ? 'Correct. ' : 'Wrong. ') +
      (chosen==='real' ? 'That was the real photograph.' : 'That one was AI generated.');
  }

  function showDaily(){
    var h0 = S.history[today()];
    if(h0 && h0.done){ showResult(h0); return; }
    idx = (h0 && h0.idx) || 0;
    picks = (h0 && h0.picks) || [];
    locked = false;
    $('result').innerHTML='';
    drawPair($('pair'), set[idx], function(side){
      mark($('pair'), side, set[idx]);
      picks.push(side === 'real');
      S.n++; if(side==='real') S.right++;
      bumpCat(set[idx].cat, side==='real');
      $('stat').textContent = diffLine(set[idx]);
      var h = S.history[today()] || {}; h.idx = idx+1; h.picks = picks; S.history[today()] = h;
      if(idx+1 < set.length){ h.done=false; save(S); setTimeout(next, 1300); }
      else { h.done=true; bumpStreak(); save(S); setTimeout(function(){showResult(h)}, 1300); }
    }, idx===0);
    $('hint').innerHTML = 'Which one is the real photograph? <b>' + (idx+1) + '/' + set.length + '</b>';
    renderProg();
    renderStreak();
    credit(set[idx]);
  }
  function next(){ idx++; locked=false; save(S); showDaily(); }

  function renderProg(){
    var h=''; for(var i=0;i<set.length;i++){
      var c='dot'; if(i<idx) c+= (picks[i]?' ok':' no'); else if(i===idx) c+=' on';
      h += '<div class="'+c+'"></div>';
    } $('prog').innerHTML=h;
  }

  function bumpCat(cat, ok){
    var c = S.cats[cat] || (S.cats[cat] = {n:0, right:0});
    c.n++; if(ok) c.right++;
  }

  function bumpStreak(){
    var y = new Date(Date.now()-86400000);
    var yd = y.getUTCFullYear()+'-'+String(y.getUTCMonth()+1).padStart(2,'0')+'-'+String(y.getUTCDate()).padStart(2,'0');
    if(S.lastDay === yd) S.streak = (S.streak||0)+1; else if(S.lastDay !== today()) S.streak = 1;
    S.lastDay = today();
  }

  function showResult(h){
    $('pair').innerHTML=''; $('prog').innerHTML=''; $('hint').textContent='Today’s result';
    var list = h.picks || [];
    var ok = list.filter(Boolean).length, tot = list.length;
    var grid = list.map(function(b){return b?'🟩':'🟥'}).join('');
    var acc = S.n ? Math.round(S.right/S.n*100) : 0;
    var txt = 'REAL·OR·AI ' + today() + '\n' + grid + '  ' + ok + '/' + tot +
              '\n🔥 ' + (S.streak||0) + ' day streak · ' + acc + '% lifetime';
    $('result').innerHTML =
      '<div class="card"><div class="big">'+ok+' / '+tot+'</div>'+
      '<div class="statline">Lifetime accuracy '+acc+'% · streak '+(S.streak||0)+'</div>'+
      '<textarea class="sharebox" id="share" rows="4" readonly>'+esc(txt)+'</textarea>'+
      '<div class="row" style="margin-top:10px">'+
      '<button class="btn" id="copyBtn">Copy score</button>'+
      '<button class="btn ghost" id="moreBtn">Practice more</button></div>'+
      '<div class="row" style="margin-top:10px"><a class="btn ghost" href="daily/'+today()+'.html">Today’s hints &amp; answers</a></div></div>';
    $('copyBtn').onclick = function(){ copy(txt); };
    $('moreBtn').onclick = function(){ switchTab('free'); };
    $('stat').textContent='';
  }

  function showFree(){
    if(!P.length) return;
    var pool = P.filter(function(p){ return freeRecent.indexOf(p.id) < 0; });
    if(!pool.length){ freeRecent = []; pool = P; }
    var p = pool[Math.floor(Math.random()*pool.length)];
    freeRecent.push(p.id); if(freeRecent.length > Math.min(3, P.length-1)) freeRecent.shift();
    locked=false;
    $('stat2').textContent='';
    drawPair($('pair2'), p, function(side){
      mark($('pair2'), side, p);
      S.n++; if(side==='real') S.right++;
      bumpCat(p.cat, side==='real'); save(S);
      $('stat2').innerHTML = (side==='real' ? 'Correct — ' : 'Nope — ') + esc(diffLine(p));
    }, true);
    credit(p);
  }

  function credit(p){
    var r = p.real, link = r.source ? '<a href="'+esc(r.source)+'" rel="nofollow">'+esc(r.title)+'</a>' : esc(r.title);
    $('credits').innerHTML = 'Real photo: “'+link+'” — '+esc(r.artist)+' ('+esc(r.license)+'), Wikimedia Commons';
  }

  function copy(t){
    var done=function(){var e=$('toast');e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1500)};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,function(){fb(t,done)});
    else fb(t,done);
  }
  function fb(t,done){ var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.left='-9999px';
    document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(a); }

  function switchTab(which){
    var d = which==='daily';
    $('tabDaily').classList.toggle('on', d); $('tabFree').classList.toggle('on', !d);
    $('tabDaily').setAttribute('aria-selected', d?'true':'false');
    $('tabFree').setAttribute('aria-selected', d?'false':'true');
    $('dailyView').classList.toggle('hidden', !d); $('freeView').classList.toggle('hidden', d);
    if(d) showDaily(); else showFree();
  }
  $('tabDaily').onclick=function(){switchTab('daily')};
  $('tabFree').onclick=function(){switchTab('free')};
  $('nextFree').onclick=function(){showFree()};

  $('footnote').textContent = P.length + ' pairs loaded · ' + today();
  renderStreak();
  showDaily();
})();
</script>
</body>
</html>
